name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: Fleet gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oosed

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Require clang
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          command -v clang >/dev/null || { echo "clang is required to build the tool"; exit 1; }

      - name: Build the oodar runtime
        working-directory: ${{ github.workspace }}
        run: make -C oodar/scripts -f Makefile modular

      - name: Require a build target
        working-directory: ${{ github.workspace }}/oosed
        run: |
          if ! grep -qE '^build[[:space:]]*:' Makefile; then
            echo "::error::This repository has no build target. The tool is a stub and is tracked in the fleet backlog."
            exit 1
          fi

      - name: Build the tool
        working-directory: ${{ github.workspace }}/oosed
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: "1"
        run: make build

      - name: Require the tool binary
        if: always()
        working-directory: ${{ github.workspace }}/oosed
        run: |
          if [ ! -x "dist/oosed" ]; then
            echo "::error::dist/oosed was not produced. The tool is not implemented and is tracked in the fleet backlog."
            exit 1
          fi

      - name: Verify
        working-directory: ${{ github.workspace }}/oosed
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: "1"
        run: make verify

      - name: Test
        working-directory: ${{ github.workspace }}/oosed
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: "1"
        run: make test

      - name: Pure test audit
        working-directory: ${{ github.workspace }}/oosed
        run: |
          if make -n pure >/dev/null 2>&1; then
            make pure
          else
            echo "This repository has no pure target."
          fi

      - name: Double-run determinism
        working-directory: ${{ github.workspace }}/oosed
        run: |
          mkdir -p .ooda-cache
          ./dist/oosed --version > .ooda-cache/run1.txt 2>&1 || true
          ./dist/oosed --version > .ooda-cache/run2.txt 2>&1 || true
          cmp -s .ooda-cache/run1.txt .ooda-cache/run2.txt || { echo "::error::the tool is not deterministic across two runs"; exit 1; }

      - name: Install the upstream tool
        working-directory: ${{ github.workspace }}
        run: |
          if ! command -v sed >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sed
          fi
          command -v sed >/dev/null 2>&1 || { echo "::error::the upstream tool sed is required for the parity gate"; exit 1; }

      - name: Parity against the upstream tool
        working-directory: ${{ github.workspace }}/oosed
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: "1"
        run: make parity

